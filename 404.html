<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Quilibrium is a decentralized alternative to platform as a service providers, offering complete privacy to end users with familiar APIs.">

    <!-- Facebook Meta Tags -->
    <meta property="og:url" content="https://dashboard.quilibrium.com">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Quilibrium Dashboard">
    <meta property="og:description" content="Live network statistics for Quilibrium.">
    <meta property="og:image" content="%PUBLIC_URL%/card.png">

    <!-- Twitter Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta property="twitter:domain" content="dashboard.quilibrium.com">
    <meta property="twitter:url" content="https://dashboard.quilibrium.com">
    <meta name="twitter:title" content="Quilibrium Dashboard">
    <meta name="twitter:description" content="Live network statistics for Quilibrium.">
    <meta name="twitter:image" content="%PUBLIC_URL%/card.png">
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/favicon.png" />
    <link rel="manifest" href="/manifest.json"/>
    <title>Quilibrium</title>
    <script>
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1).join('/') + '/?/' +
        l.pathname.slice(1).replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
</head>

</html>
